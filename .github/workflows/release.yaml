name: Build and Publish Images

on:
  push:
    tags:
      - '*/[0-9]+.[0-9]+.[0-9]+'

permissions:
  packages: write

jobs:
    create-docker-image:
        runs-on: ubuntu-latest

        steps:

        - 
          name: Extract Tag Information
          id: tag_info
          run: echo "TAG=${{ github.ref }}" >> $GITHUB_ENV

        - 
          name: Set Algorithm Name Variable
          id: algorithm
          run: echo "ALGORITHM=$(echo $TAG | cut -d '/' -f 3)" >> $GITHUB_ENV

        - 
          name: Extract Version from Tag
          id: version
          run: echo "VERSION=$(echo $TAG | cut -d '/' -f 4)" >> $GITHUB_ENV

        - 
          name: Login to Github Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        -
          name: Build and push
          uses: docker/build-push-action@v7
          with:
            push: true
            file: ./docker/${{ env.ALGORITHM }}.Dockerfile
            tags: |
              euracan/starter-${{ env.ALGORITHM }}:latest
              euracan/starter-${{ env.ALGORITHM }}:${{ env.VERSION }}
